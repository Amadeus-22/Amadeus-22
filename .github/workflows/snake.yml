# Generates the animated contribution graph and commits it to the `output`
# branch of this repository.
#
# Self-hosted on purpose: every third-party card service tried for this README
# was either rate-limited (503) or out of Vercel quota (402). The SVG produced
# here is served from raw.githubusercontent.com, so it cannot go down
# independently of GitHub itself.
name: Contribution snake

on:
  schedule:
    - cron: "0 3 * * *"   # daily, 03:00 UTC
  workflow_dispatch:       # manual run
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate the SVGs
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark
            dist/snake-light.svg?palette=github-light

      - name: Push them to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
