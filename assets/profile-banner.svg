<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="t d">
  <title id="t">Amadeus (Pedro Barbosa) — Quantitative Developer and Systems Engineer</title>
  <desc id="d">Quantitative research in Python and R. Production systems in Go and PHP. Rio de Janeiro, Brazil.</desc>

  <defs>
    <linearGradient id="kraft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#cbb28a"/>
      <stop offset="0.38" stop-color="#c2a67c"/>
      <stop offset="0.72" stop-color="#b89a6d"/>
      <stop offset="1"    stop-color="#a98b5d"/>
    </linearGradient>

    <!-- mancha grossa: irregularidade do papel -->
    <filter id="mottle">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="4" seed="17"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <!-- granulado fino: fibra -->
    <filter id="fiber">
      <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2" seed="5"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>

    <radialGradient id="stainA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#5c4326" stop-opacity="0.16"/>
      <stop offset="0.7" stop-color="#5c4326" stop-opacity="0.05"/>
      <stop offset="1"   stop-color="#5c4326" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="burn" cx="0.5" cy="0.5" r="0.68">
      <stop offset="0.5" stop-color="#2e2010" stop-opacity="0"/>
      <stop offset="1"   stop-color="#2e2010" stop-opacity="0.34"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="360" fill="url(#kraft)"/>
  <rect width="1280" height="360" filter="url(#mottle)" opacity="0.16"/>
  <rect width="1280" height="360" filter="url(#fiber)"  opacity="0.09"/>
  <ellipse cx="212" cy="86"  rx="190" ry="112" fill="url(#stainA)"/>
  <ellipse cx="1064" cy="296" rx="230" ry="130" fill="url(#stainA)"/>
  <rect width="1280" height="360" fill="url(#burn)"/>

  <!-- moldura carimbada: filete grosso, filete fino, traço levemente irregular -->
  <g stroke="#2b2116" fill="none">
    <path d="M30 31 L1250 29 L1251 331 L29 329 Z" stroke-width="3.4" opacity="0.88"/>
    <path d="M42 43 L1238 41.5 L1239 319 L41 317.5 Z" stroke-width="1" opacity="0.62"/>
  </g>

  <!-- fleurões de canto -->
  <g fill="#7b2d26" opacity="0.9">
    <path d="M58 60 l9 0 l0 2.6 l-6.4 0 l0 6.4 l-2.6 0 Z"/>
    <path d="M1222 60 l-9 0 l0 2.6 l6.4 0 l0 6.4 l2.6 0 Z"/>
    <path d="M58 300 l9 0 l0 -2.6 l-6.4 0 l0 -6.4 l-2.6 0 Z"/>
    <path d="M1222 300 l-9 0 l0 -2.6 l6.4 0 l0 -6.4 l2.6 0 Z"/>
  </g>

  <text x="640" y="126" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', 'Palatino Linotype', serif"
        font-size="76" font-weight="700" fill="#241a0f" letter-spacing="13">AMADEUS</text>

  <!-- assinatura: o nome legal sob o nome de trabalho, como se assina obra -->
  <text x="640" y="156" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="17" font-style="italic" fill="#4a3720" letter-spacing="3.4" opacity="0.9">Pedro Barbosa</text>

  <!-- filete com fleurão central -->
  <g stroke="#7b2d26" stroke-width="1.7" opacity="0.92">
    <line x1="286" y1="182" x2="588" y2="182"/>
    <line x1="692" y1="182" x2="994" y2="182"/>
  </g>
  <g fill="#7b2d26" opacity="0.92">
    <path d="M640 172 l10 10 l-10 10 l-10 -10 Z"/>
    <path d="M612 182 l7 -4 l0 8 Z"/>
    <path d="M668 182 l-7 -4 l0 8 Z"/>
  </g>

  <text x="640" y="220" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="20" font-weight="700" fill="#4a3720" letter-spacing="7">QUANTITATIVE DEVELOPER &#183; SYSTEMS ENGINEER</text>

  <text x="640" y="254" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="18" font-style="italic" fill="#3f2f1c" opacity="0.94">Quantitative research in Python and R &#183; production systems in Go and PHP</text>

  <line x1="200" y1="280" x2="1080" y2="280" stroke="#5c4326" stroke-width="0.9" opacity="0.55"/>

  <text x="640" y="306" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="14" fill="#4a3720" letter-spacing="2.6" opacity="0.92">RIO DE JANEIRO &#8212; UTC&#8722;3 &#8212; ENGLISH &amp; PORTUGU&#202;S &#8212; AVAILABLE FOR REMOTE WORK</text>
</svg>
