<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="t d">
  <title id="t">Pedro Barbosa — Quantitative Developer and Systems Engineer</title>
  <desc id="d">Quantitative research in Python and R. Production systems in Go and PHP. Rio de Janeiro, Brazil.</desc>

  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#f2e9d8"/>
      <stop offset="0.5" stop-color="#ece1cd"/>
      <stop offset="1"   stop-color="#e4d8c2"/>
    </linearGradient>

    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.72">
      <stop offset="0.62" stop-color="#2b2419" stop-opacity="0"/>
      <stop offset="1"    stop-color="#2b2419" stop-opacity="0.16"/>
    </radialGradient>

    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1280" height="340" fill="url(#paper)"/>
  <rect width="1280" height="340" filter="url(#grain)" opacity="0.055"/>
  <rect width="1280" height="340" fill="url(#vignette)"/>

  <!-- régua dupla: a moldura de impressão -->
  <rect x="26" y="26" width="1228" height="288" fill="none" stroke="#2f2a20" stroke-width="2.5"/>
  <rect x="36" y="36" width="1208" height="268" fill="none" stroke="#2f2a20" stroke-width="0.9"/>

  <text x="640" y="118" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', 'Palatino Linotype', serif"
        font-size="60" font-weight="700" fill="#241f16" letter-spacing="3">PEDRO BARBOSA</text>

  <!-- filete com ornamento central -->
  <g stroke="#7b2d26" stroke-width="1.6">
    <line x1="300" y1="146" x2="596" y2="146"/>
    <line x1="684" y1="146" x2="980" y2="146"/>
  </g>
  <g fill="#7b2d26">
    <path d="M640 138 L648 146 L640 154 L632 146 Z"/>
    <circle cx="614" cy="146" r="2.4"/>
    <circle cx="666" cy="146" r="2.4"/>
  </g>

  <text x="640" y="184" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="20" font-weight="600" fill="#5c4a32" letter-spacing="6.5">QUANTITATIVE DEVELOPER &#183; SYSTEMS ENGINEER</text>

  <text x="640" y="224" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="18" font-style="italic" fill="#4a4034">Quantitative research in Python and R &#183; production systems in Go and PHP</text>

  <line x1="180" y1="252" x2="1100" y2="252" stroke="#8a7a5e" stroke-width="0.9"/>

  <g font-family="Georgia, 'Times New Roman', serif" font-size="14.5" fill="#5c5140" letter-spacing="1.6">
    <text x="640" y="282" text-anchor="middle">RIO DE JANEIRO, BRAZIL &#160;&#8212;&#160; UTC&#8722;3 &#160;&#8212;&#160; ENGLISH &amp; PORTUGU&#202;S &#160;&#8212;&#160; AVAILABLE FOR REMOTE WORK</text>
  </g>
</svg>
