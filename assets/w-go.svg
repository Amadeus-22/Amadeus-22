<svg xmlns="http://www.w3.org/2000/svg" width="628" height="300" viewBox="0 0 628 300" role="img" aria-labelledby="t">
  <title id="t">Backend systems in Go — Services that ship as a single static binary with no runtime dependencies. SQLite with full-text search, subprocess isolation over versioned contracts, systemd deployment.</title>
  <defs>
    <linearGradient id="bgc1d" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f16"/><stop offset="0.55" stop-color="#070a10"/>
      <stop offset="1" stop-color="#0d1219"/>
    </linearGradient>
    <linearGradient id="redc1d" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3b30" stop-opacity="0.25"/>
      <stop offset="0.5" stop-color="#ff3b30"/>
      <stop offset="1" stop-color="#ff3b30" stop-opacity="0.25"/>
    </linearGradient>
    <pattern id="scanc1d" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.4" fill="#8fc7ff" fill-opacity="0.045"/>
    </pattern>
  </defs>
  <rect width="628" height="300" fill="url(#bgc1d)"/>
  <rect width="628" height="300" fill="url(#scanc1d)"/>

  <g stroke="#ff3b30" stroke-width="2.0" fill="none" opacity="0.9">
    <path d="M10 28 L10 10 L28 10"/><path d="M600 10 L618 10 L618 28"/>
    <path d="M10 272 L10 290 L28 290"/><path d="M600 290 L618 290 L618 272"/>
  </g>

  <rect x="0" y="0" width="628" height="3" fill="url(#redc1d)"/>
  <g fill="#ff3b30"><rect x="36" y="40" width="6" height="24"/></g>
  <text x="54" y="60" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="26" font-weight="700" fill="#eef4fb" letter-spacing="1.6">BACKEND SYSTEMS IN GO</text>
  <line x1="36" y1="82" x2="592" y2="82" stroke="#39506b" stroke-width="1.4" opacity="0.8"/>
  <text x="36" y="116" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="20" fill="#a8bcd2">Services that ship as a single static</text>
  <text x="36" y="146" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="20" fill="#a8bcd2">binary with no runtime dependencies.</text>
  <text x="36" y="176" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="20" fill="#a8bcd2">SQLite with full-text search, subprocess</text>
  <text x="36" y="206" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="20" fill="#a8bcd2">isolation over versioned contracts,</text>
  <text x="36" y="236" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="20" fill="#a8bcd2">systemd deployment.</text>
</svg>