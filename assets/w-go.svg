  <text x="54" y="56" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="19" font-weight="700" fill="#eef4fb" letter-spacing="2.2">BACKEND SYSTEMS IN GO</text>
  <line x1="38" y1="76" x2="590" y2="76" stroke="#39506b" stroke-width="1" opacity="0.7"/>
  <text x="38" y="104" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13.5" fill="#9fb2c8">Services that ship as a single static binary with no</text>
