  <line x1="30" y1="114" x2="530" y2="114" stroke="#8fa2bb" stroke-width="1.6" opacity="0.8"/>
  <text x="30" y="152" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="24" fill="#33414f">Services that ship as a single</text>
  <text x="30" y="186" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="24" fill="#33414f">static binary with no runtime</text>
  <text x="30" y="220" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="24" fill="#33414f">dependencies. SQLite with</text>
  <text x="30" y="254" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="24" fill="#33414f">full-text search, subprocess</text>
  <text x="30" y="288" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="24" fill="#33414f">isolation over versioned</text>
